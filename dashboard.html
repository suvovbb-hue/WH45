<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WH45 Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding-bottom:80px;
}

.header{
background:#111827;
padding:20px;
text-align:center;
border-bottom:2px solid #2563eb;
}

.header h1{
color:#60a5fa;
}

.balance-box{
margin:20px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
}

.balance-box h2{
color:#22c55e;
font-size:32px;
}

.tab-content{
padding:20px;
}

.task-card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.task-left{
display:flex;
align-items:center;
gap:15px;
}

.logo{
width:50px;
height:50px;
border-radius:50%;
background:#25D366;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
}

.start-btn{
background:#2563eb;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;
}

.start-btn:hover{
background:#1d4ed8;
}

.profile-card,
.earn-card{
background:#1e293b;
padding:20px;
border-radius:15px;
line-height:2;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111827;
display:flex;
justify-content:space-around;
padding:15px 0;
border-top:2px solid #2563eb;
}

.bottom-nav button{
background:none;
border:none;
color:white;
font-size:16px;
cursor:pointer;
}

.active{
color:#60a5fa;
font-weight:bold;
}

.hidden{
display:none;
}

</style>
</head>
<body>

<div class="header">
<h1>WH45 Dashboard</h1>
</div>

<div class="balance-box">
<p>Current Balance</p>
<h2>₹0</h2>
</div>

<!-- TASK TAB -->

<div id="taskTab" class="tab-content">

<div class="task-card">

<div class="task-left">

<div class="logo">📱</div>

<div>
<h3>WA Earn Rewards</h3>
<p>Reward ₹2000</p>
</div>

</div>

<button class="start-btn">
Start Task
</button>

</div>

<div class="task-card">

<div class="task-left">

<div class="logo">⭐</div>

<div>
<h3>VIP WA Tasks</h3>
<p>Reward ₹8000</p>
</div>

</div>

<button class="start-btn">
Start Task
</button>

</div>

</div>

<!-- EARNINGS TAB -->

<div id="earningsTab" class="tab-content hidden">

<div class="earn-card">

<h3>Total Earnings</h3>

<p>₹0</p>

<br>

<h3>History</h3>

<p>No earnings yet.</p>

</div>

</div>

<!-- PROFILE TAB -->

<div id="profileTab" class="tab-content hidden">

<div class="profile-card">

<p><strong>User Name:</strong> Rahul Das</p>

<p><strong>User ID:</strong> WH45-1001</p>

<p><strong>Balance:</strong> ₹0</p>

<p><strong>Completed Tasks:</strong> 0</p>

</div>

</div>

<div class="bottom-nav">

<button id="taskBtn" class="active">
📋 Task
</button>

<button id="earnBtn">
💰 Earnings
</button>

<button id="profileBtn">
👤 Profile
</button>

</div>

<script>

const taskTab=document.getElementById("taskTab");
const earningsTab=document.getElementById("earningsTab");
const profileTab=document.getElementById("profileTab");

const taskBtn=document.getElementById("taskBtn");
const earnBtn=document.getElementById("earnBtn");
const profileBtn=document.getElementById("profileBtn");

taskBtn.onclick=()=>{
taskTab.classList.remove("hidden");
earningsTab.classList.add("hidden");
profileTab.classList.add("hidden");

taskBtn.classList.add("active");
earnBtn.classList.remove("active");
profileBtn.classList.remove("active");
}

earnBtn.onclick=()=>{
taskTab.classList.add("hidden");
earningsTab.classList.remove("hidden");
profileTab.classList.add("hidden");

taskBtn.classList.remove("active");
earnBtn.classList.add("active");
profileBtn.classList.remove("active");
}

profileBtn.onclick=()=>{
taskTab.classList.add("hidden");
earningsTab.classList.add("hidden");
profileTab.classList.remove("hidden");

taskBtn.classList.remove("active");
earnBtn.classList.remove("active");
profileBtn.classList.add("active");
}

</script>

</body>
</html>
